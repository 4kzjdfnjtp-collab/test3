name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-14
          - rid: osx-x64
            runner: macos-13
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Build .app
        run: ./scripts/build-mac-app.sh "${{ matrix.rid }}"

      - name: Upload app zip
        uses: actions/upload-artifact@v4
        with:
          name: MIDIProgramSplitter-${{ matrix.rid }}
          path: artifacts/MIDIProgramSplitter-${{ matrix.rid }}.app.zip
          if-no-files-found: error
